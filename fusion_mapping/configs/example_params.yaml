# ---------------------------------------------------------------------------
# Example parameters for the multi-survey fusion pipeline (RMUC 2026 arena)
# All lengths in metres, angles in degrees.
# ---------------------------------------------------------------------------

step1_register_venue:
  zmin: 2.0             # venue structure band used for coarse registration
  zmax: 12.0
  res: 0.5              # 2D occupancy cell for the rotation/translation search
  angle_step: 2.0
  top_k: 6              # candidates refined with 3D ICP
  ds: 0.25              # voxel size of the ICP input clouds
  trim: 0.7             # ICP trimming ratio
  iters: 40

step2_refine_point_to_plane:
  zmin: 0.8
  zmax: 20.0
  ds: 0.15
  normal_k: 16

step3_fuse_scans:
  # venue frame -> field frame (RMUC 2026 / SUMA map frame)
  rot_deg: 52.61
  center: [8.09, -6.71]
  translate: [14.006, 8.265]
  plane: [-0.0013, -0.0011, 0.556]   # z_ground = a*x + b*y + c in field coords
  datum: auto                          # re-datum source floor peak to 0
  xmin: -0.5
  xmax: 28.5
  ymin: -0.5
  ymax: 16.5

step4_clean_dynamic:
  model_dist: 0.30      # keep only points near the official model
  voxel: 0.1            # connected-component voxel
  min_points: 100       # drop components smaller than this (fog / people)
  ground_band: 0.35
  dedupe: 0.03

step5_shape_by_official_model:
  block: 1.5            # offset-field block size
  match_dist: 0.35
  min_pairs: 25
  evidence_dist: 0.35
  floor_z: 0.12
  dedupe: 0.02

step6_tunnel_repair:
  dedupe: 0.02
  zones_file: configs/tunnel_zones.json
